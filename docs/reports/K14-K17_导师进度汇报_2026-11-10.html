ight:18px;width:min(670px,94vw);max-height:42vh;overflow:auto;background:#fffef9;border:1px solid #aeb8bb;padding:25px;font-size:20px;line-height:1.7;z-index:22;box-shadow:0 8px 35px #0005;display:none}#notes.show{display:block}#notes h3{margin:0 0 12px;font-size:20px;color:var(--teal)}#progress{position:fixed;bottom:0;height:4px;left:0;background:#6bc2bb;z-index:30}#overview{display:none;position:fixed;inset:0;overflow:auto;background:#172832f7;padding:40px;z-index:40;grid-template-columns:repeat(3,1fr);gap:18px;align-content:start}#overview.open{display:grid}.jump{text-align:left;padding:25px;min-height:130px;font-size:21px;border:1px solid #ffffff50}.jump small{display:block;color:#8fd1cd;margin-bottom:12px}#audit{display:none}@media print{@page{size:1600px 900px;margin:0}body{background:white}#stage{position:static;transform:none!important;width:1600px;height:auto}.slide{position:relative;visibility:visible;height:900px;break-after:page;page-break-after:always;pointer-events:auto}#controls,#notes,#progress,#overview{display:none!important}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

<script>
const source={k14:'2026-11-09_K14研读_机制结论修正与下一步.md',k15:'2026-11-10_K15_共同背景与固定增益对照.md',k16:'2026-11-10_K16_共同响应通道拆分_机制实验报告.md',k17:'2026-11-10_K17_S组拆分_高度旋转夹爪与左右不对称.md'};
const table=(headers,rows,focus=[])=>`<table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map((r,i)=>`<tr class="${focus.includes(i)?'focus':''}">${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
const bars=(rows,max=40)=>`<div class="bars">${rows.map(r=>`<div class="barrow"><div>${r[0]}</div><div class="track"><div class="fill ${r[3]||''}" style="width:${r[1]/max*100}%"></div></div><div class="barvalue">${r[1]}/${r[2]||max}</div></div>`).join('')}</div>`;
const slides=[
{tag:'研究进度 · 2026.11.10',title:'旧指令还能起作用，<br>为什么机器人仍会选错目标？',hero:true,body:`<p class="lead">K14–K17：从残留语言控制，追到动作生成通道的配合。</p><p class="sub">四轮诊断均已有结果。本次只汇报推理干预，没有新增保护训练。</p>`,src:['k14','k15','k16','k17'],note:'开场先讲例子：机器人原来会按左、右两句放书，继续学前格后，旧指令容易被新目标接管。最近四轮重点不是再证明会忘，而是检验剩下的指令响应怎样才能重新控制动作。我们仍在机制诊断阶段，没有把干预包装成已可部署的防遗忘算法。'},
{tag:'共同实验设置',title:'先让模型学左右，再让它只学前格',body:`<div class="sequence"><div><h2>旧模型 R1</h2><p>联合学习左格、右格</p></div><span>随后续训</span><div><h2>续训模型</h2><p>Front-12000，只学前格</p></div></div><div class="cols rule"><div><h2>给所有干预相同起点</h2><p>20 个共同快照，均由续训模型先按 Front 抓起书，尚未进入目标区。</p></div><div><h2>只在短窗口借用旧响应</h2><p>干预 60 个控制步，随后交回续训模型，到第 400 步评分。</p></div></div><p class="small muted">同一批开发状态 20–39；左右各 20 回合。不是 40 个独立物理状态，也不是独立确认集。</p>`,src:['k15','k16','k17'],note:'R1 与此前左加前的 R0 不要混淆。这轮主线是左加右，再学前。共同快照排除了左右指令先走出不同前缀的混淆。干预都在相同输入口径上计算，执行分叉后观察与草稿自然不同。所有收益仍依赖旧模型响应。'},
{tag:'先讲清楚两个词',title:'把两句回答拆成“共有安排”和“左右修正”',body:`<div class="cols"><div><div class="formula">μ = (v左 + v右) / 2<br>d = (v左 − v右) / 2</div><p>μ 是两句共有的动作生成响应。<br>d 是换成左右句子后的差别。</p></div><div><h2>现在使用的校正</h2><div class="formula"><small>校正(q) = 选定来源的 μ<br>＋ 2.959 × [v新(q) − μ新]</small></div><p class="small">真实句子 q 直接送入续训模型。程序不按“正确答案是左还是右”选择正负号。</p></div></div><div class="callout">通俗理解：同一份左右修正，叠加到不同基础动作安排上，执行结果可能不同。</div><p class="small muted">这是归一化动作草稿的去噪输出分解，不是机器人位移，也不是两个已定位的神经模块。</p>`,src:['k14','k15'],note:'可以用基础动作安排加指令修正来解释，但不要说 μ 是纯运动、d 是纯语言。二者都可能包含多个动作通道。2.959 来自 K14 开发探针，不是每个状态临时调到成功。旧模型只为当前句子提供共同背景，条件修正由新模型自己的句子响应产生。'},
{tag:'四轮工作全貌',title:'问题逐步从“信号还在吗”缩小到“怎样配合”',body:table(['实验','具体问什么','当前回答'],[['K14','旧指令响应还能用吗？','在旧背景下放大，可恢复多数分流'],['K15','只放大，不换背景行吗？','有部分收益，但双向分流仍为零'],['K16','共同背景的哪组通道重要？','水平与其余执行通道需要配合'],['K17','其余通道里，谁贡献最清楚？','旧水平背景下，旋转最明确；高度有取舍']])+`<p class="callout">目前定位到输出通道的功能关系，尚未解释训练更新为何形成这种关系。</p>`,src:['k14','k15','k16','k17'],note:'这一页用作目录，不念全部技术细节。K14 材料是对组员原始结果与统计代码的研读复算，未独立重跑所有轨迹。K15 到 K17 则有各自完成与验收记录。接下来每页只回答一个问题。'},
{tag:'K14 · 残留响应的可用性',title:'同幅度下，两层补丁没有显示超过直接放大的收益',body:table(['旧共同背景下的条件区别','成对首次分流','最终正确'],[['原生新区别','0/20','5/40'],['新区别匹配旧幅度','16/20','20/40'],['历史残差补丁，同幅度','16/20','21/40'],['纯模块补丁，同幅度','16/20','21/40']],[1])+`<div class="callout">先用简单放大作为强对照，不再主张“两处特殊语义位置必须修复”。</div><p class="small muted">逐输入幅度匹配组；与固定增益 2.959 组分开。点估计接近，不是严格等效证明。</p>`,src:['k14'],note:'成对分流是同一个物理状态下，给左先左，给右先右，两条都对才计一次。历史残差捕获错误已被明确区分成历史版本与纯模块版本，不能沿用此前的纯模块定位解释。K14 结果说明幅度是重要瓶颈，但背景已经换成旧模型，不能因此宣称只剩增益一个问题。'},
{tag:'K14 · 排除外部目标标签路由',title:'实际句子决定修正，近模板措辞也能恢复分流',body:`<div class="twonumbers"><div><div class="big">17/20</div><h2>规范左右句，成对分流</h2></div><div><div class="metric">15 · 18 · 15 /20</div><h2>三个近模板改写的成对分流</h2></div></div><p class="statement">相应原生模型同句测试，成对分流均为 0/20。</p><div class="callout">支持续训模型自己的指令响应仍具有控制价值。</div><p class="small muted">仍依赖旧共同背景；自由改写经父模型核验后未纳入，不能扩大成一般语言理解无损。</p>`,src:['k14'],note:'这比手工给左加补丁、给右减补丁更有说服力。旧模型共同背景不随当前实际句子的目标标签改变，两句输出的差异来自新模型自己的响应。不过措辞范围是父模型已验证的近模板集合，不能说任意新表达都理解。这里是固定增益 S_canon 的 17/20，上一页逐输入匹配 C_amp 为 16/20。'},
{tag:'K15 · 背景 × 增益',title:'相同的放大倍数，在旧共同背景下才恢复双向分流',body:`<div class="cols"><div><h2>成对首次分流 /20</h2><table class="matrix"><tr><th>μ 来源</th><th>原强度</th><th>固定放大</th></tr><tr><td>新共同背景</td><td>0</td><td>0</td></tr><tr><td>旧共同背景</td><td>0</td><td class="hit">17</td></tr></table></div><div><h2>最终正确 /40</h2>${bars([['新背景，原强度',3],['新背景，固定放大',10],['旧背景，原强度',5],['旧背景，固定放大',24]])}</div></div><p class="callout">条件差别存在，还需要与共同动作安排配合，才能在闭环中有效控制目标。</p>`,src:['k15'],note:'K15 新增 new_gain 并重跑两个端点，共 120 回合；旧背景原强度的 B 复用 K14。两种固定增益组对同一输入的左右差分公式完全相同，差别是共同平均来源。但轨迹分叉后输入也变了，不能说全程逐步差分向量一样。分流交互 85 个百分点，95% 区间 70 到 100；终态交互 30 个百分点，区间 10 到 50。该增益未针对新背景重新优化，不宣称任何增益都失败。'},
{tag:'K15 · 指标必须拆开',title:'少去新目标，可能只是变成另一种失败',body:`<h2>新背景只放大，相比原生少了 23 条先去前格的轨迹</h2><div class="twonumbers"><div><div class="big">8</div><p>改为先到正确左格</p></div><div><div class="big orange">15</div><p>变为没有进入任何目标区</p></div></div><p class="statement">“不再去错地方”不能直接当作“已经恢复旧任务”。</p><p class="small muted">新增放大组共 21 条无首次目标区；窗口末 21/21 仍抬高，18/21 仍双指接触。表现更接近搬着书但未送到目标。</p>`,src:['k15'],note:'这页给导师解释为什么不能只画目标替代率。原生先前 34/40，新背景放大后先前 11/40，看起来改善很大，但逐条配对只有 8 条恢复了正确左，另外 15 条变成无目标区。仍要同时看首次到达、曾满足原生成功和第 400 步终态。'},
{tag:'K16 · 按输出通道拆共同响应',title:'水平和其余执行通道一起恢复，右侧才有明确完成收益',body:`<p class="small">所有组的指令响应都取续训模型，固定放大 2.959 倍。字母表示 μ 的该部分换为旧来源。</p>`+table(['旧 μ 的部分','左先左 /20','右先右 /20','左终态 /20','右终态 /20'],[['N：均不换','8','0','10','0'],['H：水平 x/y','19','4','15','1'],['S：高度、旋转、夹爪','5','10','2','0'],['HS：7 个执行通道','20','17','14','10'],['HSP：再加填充通道','20','17','14','10']],[3])+`<p class="small muted rule">P 为不直接执行的 7–31 维。HS 与 HSP 的 40 条行为端点逐条一致，但完整轨迹并不相同。</p>`,src:['k16'],note:'K16 做完整 H/S/P 八格，320 回合，其中 240 新增、80 重跑 K15 端点。H 是0和1维，S是2到6维，P是7到31。最清楚的统计交互在右真正成功与终态，右终态差上差45个百分点，区间25到65。不要把 H 说成只管方向、S只管最后放好，S 单换已经影响右侧首次去向。'},
{tag:'K16 · 到达与完成的缺口',title:'S 让 10 条右指令先到右格上方，真正成功仍为零',body:`<div class="twonumbers"><div><div class="big">10/20</div><p>右指令首次到达右格水平区域</p></div><div><div class="big orange">0/20</div><p>曾满足右格原生成功判据</p></div></div><p class="lead">书始终高于格口约 2.1–5.1 厘米，且到达时仍有双指接触。</p><div class="callout">观察到了几何缺口，还不能认定“高度通道就是唯一病因”。</div>`,src:['k16','k17'],note:'范围是这十条先右的轨迹，处于右格水平投影内时最接近容纳上界仍高出约2.08到5.10厘米。这是轨迹描述，不是高度单因素因果实验。S改变去噪草稿，也可能通过内部计算改变水平输出，所以不能把它全部归为实际姿态反馈。'},
{tag:'K17 · 把 S 拆成高度 Z、旋转 R、夹爪 G',title:'旧水平背景下，旋转的恢复贡献最清楚',body:table(['旧 μ 组合','左先左 /20','右先右 /20','左终态 /20','右终态 /20'],[['H','19','4','15','1'],['HR','20','11','19','6'],['HZR','20','17','14','10'],['HZRG：完整执行通道','20','17','14','10'],['HZG：完整组合去掉旋转','16','7','10','1']],[1,2])+`<p class="callout">加上旋转，右终态 1→6；从完整组合去掉旋转，右终态 10→1。</p><p class="small muted">R 是三个旋转坐标的整体，不是某个神经层。结论限定在旧 H 背景和当前开发状态。</p>`,src:['k17'],note:'K17 是新旧 H 各做 Z/R/G八格，共640个唯一条件×回合，其中480新增160复用K16，另外8条参照重跑不算新独立样本。R同时经过添加与移除检验。H到HR右终态增25个百分点区间10到45，HZG加R增45个百分点区间25到65。没有找到哪一旋转轴最关键。'},
{tag:'K17 · 高度和夹爪的边界',title:'加高度帮助右侧，却损害部分左侧后段保持',body:`<div class="cols"><div><h2>HR 加上 Z，变成 HZR</h2>${table(['终态成功','HR','HZR'],[['左指令','19/20','14/20'],['右指令','6/20','10/20']])}<p class="small muted rule">右侧 +4 的区间仍包含零。左侧 −5 的差值区间为 −45 至 −10 个百分点。</p></div><div><h2>五条左侧损失曾经成功</h2><p>退出成功状态发生在第 240–357 步，均在干预结束之后。</p><h2 class="rule">完整组合里，旧夹爪不是必需项</h2><p class="small">HZR 与 HZRG 的 40 条行为端点逐条一致，不能扩大成夹爪毫无作用。</p></div></div>`,src:['k17'],note:'HR总终态25/40，HZR24/40，只差一条，不能只用总均值宣布HR更优。有价值的是左右构成的变化：同一高度来源帮助一边同时伤另一边。不能称“旧Z一直到最后在破坏”，因为短窗口已撤掉。原生成功本身也不保证书已松爪独立稳定。'},
{tag:'K17 · 一步更深的机制证据',title:'换同一份旋转响应，效果会随水平背景翻转',body:`<div class="cols"><div><h2>左指令终态 /20</h2><table class="matrix"><tr><th>水平背景</th><th>新旋转</th><th>旧旋转</th></tr><tr><td>新 H</td><td>10</td><td class="orange">1</td></tr><tr><td>旧 H</td><td>15</td><td class="hit">19</td></tr></table></div><div><h2>动作尚未执行，其他通道已改变</h2><div class="big">40/40</div><p>H→HR 只切换旋转 μ，首段生成动作都出现非旋转坐标变化。</p><p class="small muted">证明内部去噪联动存在，尚未证明它解释全部恢复收益。</p></div></div><p class="callout">通道并非彼此独立的物理按钮，旧响应的效果取决于配合背景。</p>`,src:['k17'],note:'左终态H×R交互65个百分点区间30到100，右终态25个百分点区间10到45。这是单侧端点，也不只是成对计分产生的数学交互。第一段十个动作在执行前一次生成，非旋转坐标已经改变，至少一部分跨通道联动发生在网络内部。真实姿态接触反馈仍可能参与。'},
{tag:'目前的机制定位',title:'已缩小到“响应配合”，训练致因链尚未闭合',body:`<div class="cols"><div><h2>已有证据支持</h2><ul><li>续训模型仍有可用于目标控制的指令响应。</li><li>共同背景和指令增益共同影响恢复。</li><li>水平、旋转与高度的作用有背景依赖和左右不对称。</li></ul></div><div><h2>尚待完成</h2><ul><li>哪类训练更新导致这些变化。</li><li>固定偏移、内部草稿反馈、实际状态反馈各占多少。</li><li>独立状态、适应随机流和另一线路的确认。</li></ul></div></div><p class="small muted rule">所有结果是旧模型参与的推理诊断；未证明语言理解完整无损，未定位唯一责任权重，也未验证防遗忘方法的新旧任务折中。</p>`,src:['k14','k15','k16','k17'],note:'给导师明确研究位置：现象已不止一段失败视频，输出层已有受控干预。但不要宣称完整内部因果链完成。目前不是新的训练算法，也不能说实验已经解决VLA语言忽略。μ/d和通道分解本身不是新原理，贡献需要更强的机制规律与独立验证承担。'},
{tag:'下一步与讨论',title:'下一轮围绕旋转、时序和训练来源补关键证据',body:`<div class="steps"><div class="step"><div class="num">优先 1</div><h2>拆三个旋转坐标</h2><p>旧 H 背景下，做单轴添加与移除，检查哪一部分影响真实成功。</p></div><div class="step"><div class="num">优先 2</div><h2>查高度的阶段作用</h2><p>固定 H＋R，预锁前段／后段窗口，解释五条左侧保持损失。</p></div><div class="step"><div class="num">随后确认</div><h2>连接训练更新</h2><p>跟踪早期检查点并操控匹配更新，用独立状态验证可预测变化。</p></div></div><div class="callout">希望最终回答：后续训练改变了哪种控制配合，为什么恢复去向仍不等于恢复完整技能？</div><p class="small muted">新实验先登记再执行。当前不按测试目标标签人工挑选左右补丁。</p>`,src:['k17','k15'],note:'请导师讨论优先级：先小范围找出旋转轴和高度作用时段，再做训练来源操控，而不是大规模扫描所有头层。同步需要新状态和独立适应种子。下一轮若增益或背景效果无法迁移，要保留边界结果，不继续调到符合预期。结束时强调这四轮从能否分流推进到动作组合怎样共同影响成功。'}
];
const stage=document.getElementById('stage');
stage.innerHTML=slides.map((s,i)=>`<section class="slide" aria-label="第 ${i+1} 页"><header><div class="eyebrow">${s.tag}</div><h1 class="${s.hero?'hero':''}">${s.title}</h1></header><main class="body">${s.body}</main><footer class="footer"><span>${s.src.map(k=>`<a href="../${source[k]}" target="_blank">${k.toUpperCase()} 原始报告</a>`).join('　')}　｜　开发性机制诊断</span><span class="page">${String(i+1).padStart(2,'0')} / ${slides.length}</span></footer></section>`).join('');
let index=0;const sections=[...document.querySelectorAll('.slide')];
function go(n){index=Math.max(0,Math.min(slides.length-1,n));sections.forEach((s,i)=>s.classList.toggle('active',i===index));document.getElementById('counter').textContent=`${index+1} / ${slides.length}`;document.getElementById('notes').innerHTML=`<h3>第 ${index+1} 页 · 讲解备注</h3>${slides[index].note}`;document.getElementById('progress').style.width=`${(index+1)/slides.length*100}%`;history.replaceState(null,'',`#${index+1}`);}
function fit(){const scale=Math.min(innerWidth/1600,(innerHeight-58)/900);stage.style.transform=`scale(${scale})`;stage.style.left=`${(innerWidth-1600*scale)/2}px`;stage.style.top=`${Math.max(0,(innerHeight-58-900*scale)/2)}px`;}
function toggleNotes(){document.getElementById('notes').classList.toggle('show');}
function fullscreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();}
function overview(){document.getElementById('overview').classList.toggle('open');}
document.getElementById('overview').innerHTML=slides.map((s,i)=>`<button class="jump" onclick="go(${i});overview()"><small>${String(i+1).padStart(2,'0')}　${s.tag}</small>${s.title.replaceAll('<br>','')}</button>`).join('');
addEventListener('resize',fit);addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(index+1)}if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(index-1)}if(e.key==='Home')go(0);if(e.key==='End')go(slides.length-1);if(e.key.toLowerCase()==='n')toggleNotes();if(e.key.toLowerCase()==='f')fullscreen();if(e.key.toLowerCase()==='o')overview();if(e.key==='Escape'){document.getElementById('notes').classList.remove('show');document.getElementById('overview').classList.remove('open')}});
go((parseInt(location.hash.slice(1))||1)-1);fit();
if(new URLSearchParams(location.search).has('audit')){const issues=[];sections.forEach((s,i)=>{const content=s.querySelector('main').getBoundingClientRect(),foot=s.querySelector('footer').getBoundingClientRect();if(content.bottom>foot.top+1)issues.push({slide:i+1,type:'body-footer'});[...s.querySelectorAll('main *')].forEach(el=>{const r=el.getBoundingClientRect();if(r.bottom>foot.top+1||r.right>s.getBoundingClientRect().right-10)issues.push({slide:i+1,type:'overflow',text:el.textContent.slice(0,45)})})});document.getElementById('audit').textContent=JSON.stringify({slides:slides.length,issues});}
</script></body></html>
